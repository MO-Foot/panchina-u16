:root, :root[data-theme="rosso"]{
  /* Maglia rossa: noi = rosso svizzero, avversari = antracite */
  --bg:#f4f2f1; --surface:#ffffff; --surface2:#f7f4f3; --ink:#161313; --muted:#625b59; --line:#ded6d3;
  --our:#d52b1e; --our-ink:#ffffff; --our-soft:#fbe4e1;
  --opp:#30353d; --opp-ink:#ffffff; --opp-soft:#e7e9ec; --opp-gk:#7b828c;
  --warn:#b98900; --warn-soft:#fff4cc; --bad:#e8590c; --bad-soft:#ffe8d9;
  --ok:#15803d; --ok-soft:#dcf3e2; --pitch:#2e7a47; --pitch2:#2a7142; --pline:rgba(255,255,255,.9);
  --head:#d52b1e; --head-ink:#ffffff; --head-btn:rgba(255,255,255,.16); --head-line:rgba(255,255,255,.45); --cross:#ffffff;
  --tab-on:#d52b1e; --tab-on-ink:#ffffff; --run-bg:#ffffff; --run-ink:#d52b1e;
  --shadow:0 1px 2px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.05); --r:14px;
}
:root[data-theme="blu"]{
  /* Maglia blu: noi = giallo fluo, avversari = bianco */
  --bg:#0c1330; --surface:#151e44; --surface2:#1b2650; --ink:#f1f3fa; --muted:#a2abc9; --line:#2b3768;
  --our:#e3f234; --our-ink:#0c1330; --our-soft:#353b1c;
  --opp:#eef1f7; --opp-ink:#0c1330; --opp-soft:#28335f; --opp-gk:#9aa3bd;
  --warn:#ff9f43; --warn-soft:#3d2b1a; --bad:#ff6b6b; --bad-soft:#40222a;
  --ok:#4ade80; --ok-soft:#173326; --pitch:#22603a; --pitch2:#1f5735; --pline:rgba(255,255,255,.8);
  --head:#0c1330; --head-ink:#f1f3fa; --head-btn:rgba(255,255,255,.08); --head-line:rgba(227,242,52,.45); --cross:#e3f234;
  --tab-on:#e3f234; --tab-on-ink:#0c1330; --run-bg:#e3f234; --run-ink:#0c1330;
  --shadow:none; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:root{--num:'Maglia','Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif}
.tok,.bignum,.pn b,.opb b,.clockbtn b,.pchip b,.pick button b,.lib,.echip,.note .mn,.num,.mtable .bignum,.bcard .bn,.bcard .bm,.tabs button,.sptabs button,h2,.matchname,.msg b,.hbtn{font-family:var(--num)}
.tabs button,.sptabs button{font-size:1.15rem;font-weight:700;letter-spacing:.01em}
h2{font-size:1.45rem;font-weight:700;letter-spacing:.005em}
button{cursor:pointer;touch-action:manipulation}
input,select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid var(--our-soft);border-color:var(--our)}
h2{font-size:1.15rem;margin:0}
h3{font-size:.95rem;font-weight:650;color:var(--muted);margin:16px 0 8px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--head);color:var(--head-ink);border-bottom:3px solid var(--head-line);display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.cross{width:26px;height:26px;flex-shrink:0;color:var(--cross)}
.matchname{font-weight:700;font-size:1.45rem!important;letter-spacing:.01em;font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{display:flex;align-items:center;gap:6px}
.clockbtn{background:var(--head-btn);border:2px solid var(--head-line);color:inherit;border-radius:12px;padding:4px 14px;min-width:120px;display:flex;align-items:baseline;gap:8px;justify-content:center}
.clockbtn.run{background:var(--run-bg);border-color:var(--run-bg);color:var(--run-ink)}
.clockbtn b{font-size:2rem;line-height:1;font-weight:700}
.clockbtn small{opacity:.8;font-variant-numeric:tabular-nums}
.hbtn{background:var(--head-btn);border:1.5px solid var(--head-line);color:inherit;border-radius:10px;min-height:44px;min-width:44px;padding:0 10px;font-weight:700;font-size:1.1rem}
.savest{font-size:.75rem;padding:4px 8px;border-radius:99px;background:var(--head-btn);white-space:nowrap}
.savest.bad{background:#000;color:#fff}
.kit{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}.kit i{width:12px;height:12px;border-radius:3px;display:block;border:1px solid rgba(255,255,255,.6)}

.tabs{position:sticky;top:63px;z-index:19;display:flex;gap:6px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;min-width:92px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:650}
.tabs button.on{background:var(--tab-on);color:var(--tab-on-ink);border-color:var(--tab-on)}
main{padding:12px;padding-bottom:40px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cardhead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600}
.btn.pri{background:var(--our);border-color:var(--our);color:var(--our-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.big{min-height:56px;font-size:1.05rem}
.btn:disabled{opacity:.45}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:flex-end}
.badge{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.hint{color:var(--muted);font-size:.88rem;margin:8px 0}
.empty{color:var(--muted);font-style:italic}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld.inline{margin:0;min-width:150px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{display:grid;grid-template-columns:90px 1fr auto;gap:8px}
.num{text-align:center;font-weight:700;font-size:1.15rem}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:46px;padding:0 14px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}

/* Pre */
.pre{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;align-items:start}
.pre .wide{grid-column:1/-1}
.pre .precol{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:12px;min-width:0}
.pre .nois{border:4px solid #d52b1e}
.pre .avv{border:4px solid var(--opp-c1,#9aa0a6);box-shadow:0 0 0 3px var(--opp-c2,transparent);margin:3px}
.pre .master{grid-column:1;grid-row:2}
.pre .master.wide{grid-column:1/-1;grid-row:3}
.mbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 8px}
.mastercol .pitch{width:100%}
.mpanel{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.tok.ourt.ourgk{background:var(--our);color:var(--our-ink);border:3px solid var(--gk-b-our,#1f5fd1);box-shadow:0 0 0 1px #fff,0 2px 6px rgba(0,0,0,.35)}
:root[data-theme="blu"]{--gk-b-our:#ff8a00}
.halves{display:flex;justify-content:center;gap:12px;width:100%}
.phrows{display:flex;gap:40px;width:100%;justify-content:center}
.phrow{flex:1 1 0;min-width:0;border:4px solid var(--phc);border-radius:14px;padding:4px 6px 8px;position:relative;--phc:#1f5fd1}
.phrow.off{--phc:#f08a00}
.campo3{display:grid;grid-template-columns:minmax(0,1fr) clamp(250px, 22vw, 330px) minmax(0,1fr);gap:16px;align-items:start}
.campo3 .panel.mid{position:static;max-height:none;padding:12px}
.campo3 .panel.mid .zn .tag{grid-template-columns:30px 1fr 30px;min-height:48px}
.campo3 .panel.mid .zn .tag button{white-space:nowrap;padding:2px}
.campo3 .panel.mid .zn .tag button{font-size:.85rem}
.campo3 .halves .halfwrap{flex:0 0 min(calc(50% - 6px), calc((100vh - 330px) * 52.5 / 68))}
.campo3.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.qdisp{border:2px solid var(--line) !important;font-weight:700}.qdisp.on{background:#14181f !important;color:#fff !important;border-color:#14181f !important}
.dsnames{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.dsnames .btn{min-height:36px;font-size:.9rem}
.campo3 .hlab{display:flex;align-items:center;justify-content:center;gap:4px;max-width:100%}.campo3 .hlab .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hlab .mini{flex:0 0 auto;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);color:inherit;min-height:0;margin-left:4px}
.campo3.two .halves .halfwrap{flex:0 0 min(calc(50% - 6px), calc((100vh - 255px) * 52.5 / 68))}
.campo3.two .pitch.half{--t:calc(var(--tb) * 1)}
.campo3 .selfloat{position:fixed;right:12px;top:150px;width:min(340px,92vw);max-height:calc(100vh - 170px);overflow:auto;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px}
.planbar .tagbtn{min-height:36px;padding:0 12px;font-size:.95rem}
#sheet .tagbody .zn .tag{grid-template-columns:44px 1fr 44px;min-height:56px}
@media (max-width:980px){ .campo3{grid-template-columns:1fr} }
.phrow .phtitle,.phrow .hlab{color:var(--phc)}
.pitch.half .atk{position:absolute;top:2%;left:50%;transform:translateX(-50%);color:#fff;opacity:.55;font-size:1.3rem;line-height:1;pointer-events:none}
.halves .halfwrap{flex:0 0 min(calc(50% - 6px), calc((100vh - 310px) * 52.5 / 68))}
.halves .hlab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.halfwrap{display:flex;flex-direction:column;align-items:center;min-width:0}
.hlab{font-size:.78rem;font-weight:700;color:var(--warn);margin:0 0 2px;text-align:center}
.pitch.half .tok{font-size:calc(var(--t)*.48)}
.phrow{width:100%;margin-bottom:6px}
.phtitle{font-weight:700;font-size:.9rem;margin:0 0 2px;text-align:center}
.campo3 .pitch.half{--t:calc(var(--tb) * .85);aspect-ratio:52.5/68;width:100%;background:repeating-linear-gradient(90deg,var(--pitch) 0 19.04%,var(--pitch2) 19.04% 38.08%)}
.pitch.half .hsvg{position:absolute;top:0;bottom:0;width:200%;pointer-events:none}
.pitch.half .hsvg svg{position:absolute;inset:0;width:100%;height:100%}
.phseg button{min-width:150px}
.tok .tn{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;font-size:max(10px, calc(var(--t) * .38));font-weight:700;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000,0 0 1px #000;white-space:nowrap;pointer-events:none;line-height:1.05;font-family:var(--num)}
.dlist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.drow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.drow small{display:block;color:var(--muted);font-size:.8rem}
.ntog{display:inline-flex;align-items:center;gap:6px;font-weight:700;min-height:44px;padding:0 8px;cursor:pointer}
.ntog input{width:22px;height:22px;min-height:0}
.mklines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mklines line{stroke:#ffe14d;stroke-width:.45;stroke-dasharray:1.2 .8}
.tok .mk.none{bottom:auto;top:-30%;left:auto;right:-35%;transform:none;min-width:0;width:calc(var(--t)*.55);height:calc(var(--t)*.55);border-radius:50%;padding:0}
@media (max-width:1400px){ .pre .master{grid-column:1/-1;grid-row:3} .pre .precol{grid-row:1 / span 2} .mastercol .pitch{width:min(100%, calc((100vh - 230px) * 105 / 68))} }
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{position:relative;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 40px 6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);text-align:left}
.pchip b{font-size:1.7rem;font-weight:700;min-width:30px;text-align:center;line-height:1}
.pchip .nm{font-size:.9rem;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip em{font-style:normal;font-size:.78rem;font-weight:600;color:var(--muted)}
.pchip .ed{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.pchip.st-tit{border-color:var(--our);background:var(--our-soft)}
.pchip.st-tit em{color:var(--ink)}
.pchip.st-out,.pchip.st-usc{opacity:.5}
.pchip.opp{padding-right:10px;border-color:var(--opp);background:var(--opp-soft)}
.pchip.opp em{color:var(--muted)}
.pchip.opp.off{border-color:var(--line);background:var(--surface2)}
.pchip.opp.off em{color:var(--muted)}

/* Campo */
.campo{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;align-items:start}
.pitchwrap{display:flex;flex-direction:column;align-items:center}
.pitch{position:relative;width:min(100%, calc((100vh - 200px) * 105 / 68));}
.campo .pitch{width:min(100%, calc((100vh - 290px) * 105 / 68));}
.pitch{aspect-ratio:105/68;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:repeating-linear-gradient(90deg,var(--pitch) 0 9.52%,var(--pitch2) 9.52% 19.04%)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pitchfoot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;width:100%;margin-top:8px;font-size:.88rem;color:var(--muted)}
.tok{position:absolute;transform:translate(-50%,-50%);width:var(--t);height:var(--t);border-radius:50%;background:var(--opp-tok,var(--opp));color:var(--opp-tok-ink,var(--opp-ink));border:2px solid rgba(255,255,255,.95);display:grid;place-items:center;font-weight:700;font-size:calc(var(--t)*.5);box-shadow:0 2px 6px rgba(0,0,0,.35);touch-action:none;cursor:grab}
.tok.gk{background:var(--opp-tok,var(--opp));color:var(--opp-tok-ink,var(--opp-ink));border:3px solid var(--gk-b-opp,#1f5fd1);box-shadow:0 0 0 1px #fff,0 2px 6px rgba(0,0,0,.35)}
.tok.sel{outline:4px solid #ffe14d;outline-offset:2px;z-index:5}
.tok.pb{border-color:var(--warn);box-shadow:0 0 0 4px var(--warn),0 2px 6px rgba(0,0,0,.35)}
.tok .mk{position:absolute;bottom:calc(var(--t)*-.3);left:50%;transform:translateX(-50%);min-width:calc(var(--t)*.6);height:calc(var(--t)*.52);padding:0 4px;border-radius:7px;background:var(--our);color:var(--our-ink);border:2px solid #fff;font-size:calc(var(--t)*.4);display:grid;place-items:center;line-height:1}
.tok .mk.wn{display:flex;align-items:center;gap:5px;height:auto;padding:3px 8px 3px 6px;white-space:nowrap;bottom:auto;top:calc(100% - 3px);font-size:max(20px,calc(var(--t)*.52))}
.tok .mk i{font-style:normal;font-family:var(--num);font-weight:700;letter-spacing:.01em;font-size:max(20px,calc(var(--t)*.52));max-width:160px;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.tok .mk.none{background:var(--warn);color:#fff}
.tok .pbm{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:var(--warn);font-size:.85rem;display:grid;place-items:center;border:2px solid #fff}
.tok.dragging{cursor:grabbing;z-index:9;opacity:.9}
.panel{position:sticky;top:130px;max-height:calc(100vh - 142px);overflow:auto}
.bench{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;margin-top:8px;padding:8px 10px;border:2px dashed var(--line);border-radius:12px;background:var(--surface2);touch-action:none;user-select:none;-webkit-user-select:none}
.bench.hot{border-color:var(--warn);background:var(--surface)}
.bench .bl{font-size:.8rem;font-weight:700;color:var(--muted);margin-right:4px}
.btok{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:1.05rem;background:var(--opp-tok,var(--opp));color:var(--opp-tok-ink,var(--opp-ink));border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:grab;touch-action:none}
.btok.nm{box-shadow:0 0 0 2px var(--our),0 1px 3px rgba(0,0,0,.25)}
.btok.ex{opacity:.35}
.btok.fly{position:fixed;z-index:80;transform:translate(-50%,-50%);pointer-events:none;width:var(--t);height:var(--t);font-size:calc(var(--t)*.5)}
.zn h3{margin:0 0 8px}
.zn .tags{grid-template-columns:1fr 1fr;gap:6px}
.zn .tag{grid-template-columns:44px 1fr 44px;min-height:52px}
.zn .tag .tp,.zn .tag .tm{font-size:1.6rem}
.zn .tag.full{grid-column:1/-1}
.zn .tag.zdif{border-color:#1f5fd1}
.zn .tag.zoff{border-color:#f08a00}
.zn .last{list-style:none;margin:10px 0 0;padding:0;font-size:.9rem}
.zn .last li{padding:5px 0;border-top:1px solid var(--line)}
.zn .last .p{color:var(--ok);font-weight:700}.zn .last .m{color:var(--bad);font-weight:700}
.zn .actions{margin-top:10px}
.polseg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0 12px}
.polseg button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);font-weight:700;font-size:1.05rem}
.polseg button.on.p{background:var(--ok);color:#fff;border-color:var(--ok)}
.polseg button.on.z{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.polseg button.on.m{background:var(--bad);color:#fff;border-color:var(--bad)}
.selhead{display:flex;align-items:center;gap:12px}
.bignum{display:inline-grid;place-items:center;min-width:56px;height:56px;padding:0 8px;border-radius:14px;font-weight:700;font-size:2rem;color:var(--opp-ink);background:var(--opp)}
.bignum.our{background:var(--our);color:var(--our-ink)}
.bignum.sm{min-width:44px;height:44px;font-size:1.55rem;border-radius:10px}
.selhead .x{margin-left:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.pick button{min-height:62px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.pick button b{font-size:1.9rem;font-weight:700;line-height:1}
.pick button small{font-size:.72rem;color:var(--muted);max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick button.used{opacity:.7}
.pick button.cur{border-color:var(--our);background:var(--our);color:var(--our-ink)}
.pick button.cur small{color:inherit;opacity:.85}
.actions{display:grid;gap:8px;margin-top:14px}
.actions .btn{text-align:left}
.btn.on-warn{background:var(--warn);border-color:var(--warn);color:#fff}
.mtable{width:100%;border-collapse:collapse}
.mtable td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.mtable tr{cursor:pointer}
.mtable tr.pb td{background:var(--warn-soft)}
.mtable .arrow{color:var(--muted);text-align:center;width:30px}
.libchips{display:flex;flex-wrap:wrap;gap:6px}
.lib{display:inline-grid;place-items:center;min-width:40px;height:38px;padding:0 6px;border-radius:9px;background:var(--our);color:var(--our-ink);font-weight:700;font-size:1.4rem}
.log{font-size:.88rem;color:var(--muted);margin:0;padding-left:0;list-style:none}
.log li{padding:4px 0;border-bottom:1px dashed var(--line)}
.log b{color:var(--ink)}

/* Corner */
.ctop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.crow{display:grid;grid-template-columns:auto minmax(0,max-content) auto 84px minmax(240px,1fr) auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow input{text-align:center;min-height:46px;padding:6px}
.hseg button.on.h1{background:var(--warn-soft);color:var(--ink);box-shadow:inset 0 -4px 0 var(--warn)}
.hseg button.on.h2{background:var(--warn);color:#fff}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.role{min-height:40px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface2);font-size:.85rem;font-weight:600}
.role.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ckbtn{min-height:52px;min-width:110px;border-radius:12px;border:2px dashed var(--our);background:var(--surface);color:var(--our);font-weight:700}
.ckbtn.set{border-style:solid;background:var(--our);color:var(--our-ink)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:var(--r);padding:14px}
.bcard.h1{border-left-color:var(--warn)}
.bcard.h2{border-left-color:var(--warn)}
.bcard .bn{font-size:2.6rem;font-weight:700;color:var(--ink);min-width:64px;text-align:center}
.bcard .bm{font-size:2.6rem;font-weight:900;color:var(--our);min-width:64px;text-align:center}
.bcard .bm.none{color:var(--warn)}
.bcard .mid{flex:1;min-width:0}
.bcard .mid div{font-size:.85rem;color:var(--muted)}
.bcard .mid strong{display:block;font-size:1rem}
.bcard .arr{font-size:1.8rem;color:var(--muted)}

/* Campo girato (vista dalla panchina dopo il cambio di campo) */
.pitch.flip{transform:rotate(180deg)}
.pitch.flip .tok{transform:translate(-50%,-50%) rotate(180deg)}
.pitch.flip .tok.mine{transform:translate(-50%,-50%) rotate(180deg) scale(1.15)}
.pitch.flip .ball{transform:translate(-50%,-50%) rotate(180deg)}

/* Misura pedine */
:root{--t:40px}
:root[data-tok="s"]{--t:32px} :root[data-tok="l"]{--t:50px}
:root{--tb:28px} :root[data-tok="s"]{--tb:22px} :root[data-tok="l"]{--tb:36px}
.pitch.board{--t:var(--tb)}
.pitch.board .tok::before{inset:-12px}
.tok::before{content:"";position:absolute;inset:-10px;border-radius:50%}
.tsize{display:inline-flex;align-items:center;gap:4px}
.tsize span{font-weight:650;color:var(--muted);margin-right:4px}
.tsize button{min-width:46px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--num);font-size:1.5rem;font-weight:700}
.tsize button:disabled{opacity:.35}

/* Maglie */
.kitrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.kdot{display:inline-grid;place-items:center;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.25);font:700 1rem/1 var(--num);flex-shrink:0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.kbtn{display:flex;align-items:center;gap:8px;min-height:50px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);text-align:left;font-size:.88rem;font-weight:600;line-height:1.1}
.kbtn.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.kcustom{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.kcustom label{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.kcustom input[type=color]{width:56px;height:44px;padding:2px;min-height:0}
.kcustom select{width:auto}
.sheet:has(.kgrid){width:min(760px,100%)}

/* Cambi */
.subs{display:grid;gap:6px;max-height:60vh;overflow:auto;padding-right:4px}
.subrow{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.2fr);gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.sout{display:flex;align-items:center;gap:8px;min-width:0}
.sout b{font:700 1.7rem/1 var(--num);min-width:34px;text-align:center}
.sout span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sarr{color:var(--muted);font-size:1.3rem;text-align:center}
.subrow select{min-height:46px;font-weight:600}

/* Lavagna */
.bbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bsel{display:flex;align-items:center;gap:8px;font-weight:650}
.bsel select{width:auto;min-width:120px;font-family:var(--num);font-size:1.2rem;font-weight:700}
.sw{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid var(--line)}
.sw.our{background:var(--our)} .sw.opp{background:var(--opp-tok,var(--opp))}
.pitch.board{width:min(100%, calc((100vh - 230px) * 105 / 68))}
.tok.ourt{background:var(--our);color:var(--our-ink)}
.ball{position:absolute;transform:translate(-50%,-50%);width:calc(var(--t)*.5);height:calc(var(--t)*.5);border-radius:50%;background:#fff;border:3px solid #111;box-shadow:0 2px 5px rgba(0,0,0,.4);touch-action:none;z-index:6}
.ball::after{content:"";position:absolute;inset:-14px}
/* paletta colori della lavagna */
.bpal{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.bpal button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.35);padding:0;min-height:0}
.bpal button.on{outline:3px solid var(--ink,#111);outline-offset:2px}
.pitch.board.erasing{cursor:crosshair}
svg.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
svg.ink polyline{fill:none;stroke:#ffe14d;filter:drop-shadow(0 0 .25px rgba(0,0,0,.7));stroke-width:.55;stroke-linecap:round;stroke-linejoin:round}
.pitch.drawing{cursor:crosshair}
.pitch.drawing .tok,.pitch.drawing .ball{pointer-events:none}
svg.trace{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg.trace line{stroke:#fff;stroke-width:.4;stroke-dasharray:1.2 1;opacity:.9}
svg.trace circle{fill:none;stroke:#fff;stroke-width:.35;stroke-dasharray:1 .8;opacity:.9}

/* Piani */
.planbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.planbar .pl{font-weight:650;color:var(--muted);margin-right:2px}
.plchip{min-height:50px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-family:var(--num);font-size:1.4rem;font-weight:700}
.plchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plchip.add{border-style:dashed;color:var(--muted)}
.tok.ghost{background:rgba(255,255,255,.14);border:2px dashed rgba(255,255,255,.95);color:#fff;box-shadow:none}
.tok.ghost.gkg{opacity:.7}
.tok.unplaced{opacity:.6;border-style:dashed}
.tok.slot{background:rgba(0,0,0,.38);color:#fff;font-size:calc(var(--t)*.42)}
.tok.slot.gk{background:var(--opp);border:3px solid var(--gk-b-opp,#1f5fd1)}
.plus{display:inline-grid;place-items:center;width:24px;height:24px;border:2px dashed currentColor;border-radius:50%;font-size:.9rem}
.kpdisp{font-family:var(--num);font-size:3.6rem;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:12px;min-height:80px;line-height:76px;margin:12px 0 10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:66px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);font-family:var(--num);font-size:2.2rem;font-weight:700}
.kp .ok{background:var(--our);color:var(--our-ink);border-color:var(--our)}
.kpchips{display:flex;flex-wrap:wrap;gap:6px}
.kpchips button{min-width:58px;min-height:54px;border-radius:10px;border:2px solid var(--opp);background:var(--opp-soft);font-family:var(--num);font-size:1.7rem;font-weight:700}

/* Palle inattive */
.sptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sptabs button{min-height:50px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:650}
.sptabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

<script>
'use strict';
/* ============ Costanti ============ */
const LS = 'panchinaU16.v1';
const CATS = {

};

/* Schemi di palla inattiva: numeri = numeri di maglia nostri. Esempi iniziali, modificabili. */
const DEF_SP = [
  {id:'cdif', name:'Corner difensivo', type:'cdif', sides:false, slots:[
    {id:'palo', label:'Palo', p:{all:[9]}},
    {id:'vic', label:'Uomo vicino al battitore', p:{all:[6]}},
    {id:'aladx', label:'Se battono corto in due, esce anche: (da destra)', p:{all:[10]}},

    {id:'fuori', label:'Fuori area / ripartenza', p:{all:[7,11]}},

    {id:'bar', label:'Barriera', p:{all:[]}},

];
const clone = o => JSON.parse(JSON.stringify(o));

/* ============ Stato & salvataggio ============ */
let storageOK = true;
function load(){ try{ const r = localStorage.getItem(LS); return r ? JSON.parse(r) : null; }catch(e){ storageOK=false; return null; } }
const APP_VER = 'v55';
/* lingua dello schermo (definita qui perché serve già al primo disegno) */
let LANG = (() => { try { return localStorage.getItem('panchinaU16.lang') || 'it'; } catch(e){ return 'it'; } })();
const LANGS = [['it','Italiano'],['de','Deutsch'],['fr','Français'],['en','English']];
let S = load() || {v:1, squad:[], matches:{}, cur:null, view:'pre', theme:'rosso'};
if(S.theme !== 'rosso' && S.theme !== 'blu') S.theme = S.theme === 'dark' ? 'blu' : 'rosso';
let saveTimer = null;
function save(now, opt){
  if(!(opt && opt.pref)){ S.dirty = true; const cm = S.cur && S.matches[S.cur]; if(cm){ cm.mod = Date.now(); try{ recordHist(cm); }catch(e){} } if(typeof scheduleSync === 'function') scheduleSync(); }
  clearTimeout(saveTimer);
  const f = () => { try{ localStorage.setItem(LS, JSON.stringify(S)); storageOK = true; }catch(e){ storageOK = false; } updSave(); };
  if(now) f(); else saveTimer = setTimeout(f, 250);
}
/* ---- Storico marcature: fotografia a ogni cambio, per sapere a posteriori chi marcava chi ---- */
function histSnap(m){
  const nO = id => { const o = id && m.our.find(p => p.id === id); return o ? o.n : null; };
  const on = m.their.filter(q => q.on).sort((a, b) => a.n - b.n);
  return {
    ck: on.filter(q => q.ck).map(q => [q.n, nO(q.ck)]),
    mk: on.filter(q => q.mk).map(q => [q.n, nO(q.mk)]),
    sp: (m.sp || []).map(sch => [sch.id, sch.slots.map(sl => [sl.id, sl.p])]),
    our: m.our.filter(o => o.st === 'tit').map(o => o.n).sort((a, b) => a - b),
    opp: on.map(q => q.n)
  };
}
function recordHist(m){
  if(!m || !m.clock || !Array.isArray(m.their)) return;
  const h = m.hist || (m.hist = []), snap = histSnap(m), key = JSON.stringify(snap), last = h[h.length - 1];
  if(!started(m)){ const e = {half:1, sec:0, pre:true, s:snap, k:(last && last.pre && last.k) || uid()}; if(last && last.pre) h[h.length - 1] = e; else if(!h.length) h.push(e); return; }
  if(last && JSON.stringify(last.s) === key) return;
  const half = m.clock.half, sec = Math.floor(elapsed(m));
  if(last && !last.pre && last.half === half && Math.abs(sec - last.sec) < 20){ last.s = snap; return; }   // più modifiche ravvicinate = un solo cambio
  h.push({half, sec, s:snap, k:uid()});
}
function histMin(m, half, sec){ const L = +m.halfLen || 40, mm = Math.floor(sec/60) + 1, base = half === 1 ? 0 : L; return mm <= L ? (base + mm) + "'" : (base + L) + '+' + (mm - L) + "'"; }
function histAt(m, half, sec){ const h = m.hist || []; let r = null; h.forEach(e => { if(e.half < half || (e.half === half && e.sec <= sec)) r = e; }); return r; }
function parseMin(m, t){
  const L = +m.halfLen || 40, a = String(t || '').trim().match(/^(\d+)\s*(?:\+\s*(\d+))?/); if(!a) return null;
  const mi = +a[1], plus = +(a[2] || 0);
  if(mi <= L) return {half:1, sec:(mi - 1 + (mi === L ? plus : 0))*60 + 59};
  return {half:2, sec:(mi - L - 1 + plus)*60 + 59};
}
function histDiff(m, a, b){ // testo dei cambi tra due fotografie
  const out = [], name = n => { const o = m.our.find(p => p.n === n); return n + (o && fieldName(o) ? ' ' + fieldName(o) : ''); };
  const cmp = (A, B, lab) => { const ma = new Map(A), mb = new Map(B);
    new Set([...ma.keys(), ...mb.keys()]).forEach(k => { if(ma.get(k) !== mb.get(k)) out.push(`${lab} ${k}: ${ma.has(k) ? name(ma.get(k)) : '—'} → ${mb.has(k) ? name(mb.get(k)) : '—'}`); }); };
  cmp(a.ck, b.ck, 'Corner, avv.'); cmp(a.mk, b.mk, 'Gioco, avv.');

}

}

  const opts = markers(m).map(o => { const other = plan.slots.find(x => x.mk === o.n && x.id !== s.id);
    return `<button data-act="slotMk" data-n="${o.n}" class="${s.mk===o.n?'cur':''} ${other?'used':''}"><b>${o.n}</b><small>${other ? other.label : (esc(o.name) || 'libero')}</small></button>`; }).join('');
  return `<div class="selhead"><span class="bignum">${s.short}</span><div><strong>${esc(s.label)}</strong><br><small>${s.mk != null ? 'Marcato da ' + s.mk : '<span style="color:var(--warn)">Nessun marcatore</span>'}</small></div><button class="ibtn x" data-act="slotDesel" aria-label="Chiudi">✕</button></div>

}
function planPanel(m, plan, copyBtn){
  const miss = plan.slots.filter(s => !s.gk && s.mk == null), used = new Set(plan.slots.map(s => s.mk));
  const freeOur = markers(m).filter(o => !used.has(o.n));
  return `<label class="fld"><span>Nome del piano</span><input data-planname="1" value="${esc(plan.name)}"></label>
  <p class="hint" style="margin-top:0">Modulo ${esc(plan.formation)}. Tocca una posizione sul campo per assegnare il marcatore.</p>
  ${miss.length ? `<p class="warnline">Posizioni senza marcatore: ${miss.length}</p><button class="btn pri" data-act="slotNext" style="width:100%">Assegna in sequenza</button>` : '<p style="color:var(--ok);font-weight:700">Tutte le posizioni hanno un marcatore</p>'}

function openKeypad(slotId){
  const m = M(), plan = activePlan(m); if(!plan) return;
  const s = plan.slots.find(x => x.id === slotId); if(!s) return;
  UI.kp = '';
  const ids = new Set(plan.slots.map(x => x.id)), occ = occupant(m, s);
  const unpl = oppOn(m).filter(q => !ids.has(q.slot)).sort(byN);
  const roster = m.their.filter(q => !q.on).sort(byN);
  const placed = oppOn(m).filter(q => ids.has(q.slot) && q.slot !== s.id).sort(byN);
  const chips = (title, arr) => arr.length ? `<h3>${title}</h3><div class="kpchips">${arr.map(q => `<button data-act="kpN" data-n="${q.n}">${q.n}</button>`).join('')}</div>` : '';
  openModal(`<div class="kphead"><div><h2 style="margin:0">${esc(s.label)}</h2><small class="hint">${s.gk ? 'Portiere' : (s.mk != null ? 'Lo marca il ' + s.mk + (ourByN(s.mk) && ourByN(s.mk).name ? ' ' + esc(ourByN(s.mk).name) : '') : 'Nessun marcatore nel piano')}${occ ? '. Ora c\'è il n°' + occ.n : ''}</small></div></div>
    <div class="kpdisp" id="kpD">&nbsp;</div>
    <div class="kp">${[1,2,3,4,5,6,7,8,9].map(d => `<button data-act="kpD" data-d="${d}">${d}</button>`).join('')}<button data-act="kpBack" aria-label="Cancella">⌫</button><button data-act="kpD" data-d="0">0</button><button class="ok" data-act="kpOk">OK</button></div>
    ${chips('Da ricollocare', unpl)}${chips('Dalla distinta', roster)}${chips('Già in campo (scambia)', placed)}
    <div class="btnrow"><button class="btn" data-act="mClose">Chiudi</button><button class="btn" data-act="kpSkip">Salta posizione</button><button class="btn" data-act="byNumber">Tutti con i numeri standard</button></div>`, {slotId});
}
function kpCommit(n){
  if(!(n >= 0 && n < 100)) return toast('Inserisci un numero');
  const m = M(), plan = activePlan(m), sid = MC.slotId;
  placeNumber(sid, n); closeModal(); render();
  const nx = nextEmptySlot(m, plan, sid);
  if(nx) openKeypad(nx.id); else toast('Tutte le posizioni hanno un numero');
}

function swapOppPos(a, b, from){
  if(!a || !b || a === b) return;
  const ax = from ? from.x : a.x, ay = from ? from.y : a.y;
  const keep = {x:b.x, y:b.y, slot:b.slot, mk:b.mk, gk:b.gk};
  Object.assign(b, {x:ax, y:ay, slot:a.slot, mk:a.mk, gk:a.gk});
  Object.assign(a, keep);
  if(started(M())) addNote({cat:'Marcature', side:'marc', text:`Scambio posizioni: ${a.n} ↔ ${b.n}${a.mk ? ' (' + a.n + ' marcato da ' + nOur(a.mk) + ')' : ''}`, auto:true});
  save();
}
let LAST_TAP = {id:null, t:0};
/* Tocco sull'etichetta del marcatore: cambio rapido di chi lo marca */
function quickMarker(p){
  const m = M(), on = oppOn(m), list = markers(m);
  const opts = list.map(o => { const other = on.find(q => q.mk === o.id && q.id !== p.id); return {label:String(o.n), sub: other ? 'su ' + other.n : (fieldName(o) || 'libero'), cls: p.mk === o.id ? 'cur' : (other ? 'used' : '')}; });
  opts.push({label:'—', sub:'nessuno', cls: p.mk ? '' : 'cur'});
  pickModal(`Chi marca il ${p.n}${p.name ? ' (' + p.name + ')' : ''}?`, opts, i => { assign(p, i < list.length ? list[i].id : null); render(); }, '<p class="hint" style="margin-top:0">Se scegli chi marca già un altro, i due si scambiano.</p>', true);
}
/* Doppio tocco su un avversario: cambio rapido scegliendo dalla distinta */
function quickSubOpp(out){
  const m = M(), bench = m.their.filter(q => !q.on && !q.exited).sort(byN);
  const opts = bench.map(q => ({label:String(q.n), sub:q.name || ''}));
  opts.push({label:'Altro n°', sub:'non è in distinta'});
  pickModal(`Cambio: esce il ${out.n}${out.name ? ' (' + out.name + ')' : ''}. Chi entra?`, opts, i => {
    if(i >= bench.length){ UI.sel = out.id; ACT.subOpp(); return; }
    const inn = bench[i]; swapOpp(m, out, inn);
    addNote({cat:'Marcature', side:'marc', text:`Cambio loro: esce ${out.n}, entra ${inn.n}${inn.mk ? ' (lo marca ' + nOur(inn.mk) + ')' : ''}`, auto:true});
    UI.sel = inn.id; save(); render();
    toast(`Entrato il n°${inn.n} al posto del ${out.n}${inn.mk ? ': lo marca ' + nOur(inn.mk) : ''}`);
  }, bench.length ? '' : '<p class="hint">Nessun avversario in panchina nella distinta: usa «Altro n°».</p>', true);
}
function bindPitch(){
  const pitch = $('#pitch'); if(!pitch) return;
  let drag = null;
  pitch.addEventListener('pointerdown', e => {
    const t = e.target.closest('.tok');
    if(!t){ drag = {empty:true, sx:e.clientX, sy:e.clientY}; return; }   // tocco sul prato: toglie la selezione
    e.preventDefault(); t.setPointerCapture(e.pointerId);
    const p0 = t.dataset.tok && oppBy(t.dataset.tok);
    drag = {t, our:t.dataset.our || null, id:t.dataset.tok, slot:t.dataset.slot, ghost:t.classList.contains('ghost'), chip:!!e.target.closest('.mk'), sx:e.clientX, sy:e.clientY, moved:false, ox:p0 ? p0.x : null, oy:p0 ? p0.y : null};
  });
  pitch.addEventListener('pointermove', e => {
    if(drag && drag.empty){ if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 10) drag = null; return; }
    if(!drag || drag.ghost) return;
    if(!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 8) return;
    drag.moved = true; drag.t.classList.add('dragging');
    const r = pitch.getBoundingClientRect();
    let x = Math.min(97, Math.max(3, (e.clientX - r.left)/r.width*100)), y = Math.min(95, Math.max(5, (e.clientY - r.top)/r.height*100));
    if(M().flip){ x = 100 - x; y = 100 - y; }
    drag.t.style.left = x + '%'; drag.t.style.top = y + '%'; drag.x = x; drag.y = y; drag.cx = e.clientX; drag.cy = e.clientY;
    const bn = $('#bench'); if(bn && drag.id){ const br = bn.getBoundingClientRect(); bn.classList.toggle('hot', e.clientY >= br.top - 4 && e.clientY <= br.bottom && e.clientX >= br.left && e.clientX <= br.right); }
  });
  const end = () => {
    if(!drag) return;
    const d = drag; drag = null;
    if(d.our){ // nostro giocatore nel master
      if(!d.moved) return; d.t.classList.remove('dragging');
      const m = M(); m.ourPos = Object.assign({}, ourMaster(m), m.ourPos || {});
      const r = pitch.getBoundingClientRect(), tpx = d.t.offsetWidth || 40;
      const other = field(m).filter(o => o.id !== d.our && m.ourPos[o.id]).map(o => ({o, dist:Math.hypot((m.ourPos[o.id].x - d.x)/100*r.width, (m.ourPos[o.id].y - d.y)/100*r.height)})).filter(z => z.dist < tpx*0.8).sort((a, b) => a.dist - b.dist)[0];
      if(other){ const a = m.ourPos[d.our]; m.ourPos[d.our] = m.ourPos[other.o.id]; m.ourPos[other.o.id] = a; save(); render(); toast(`Scambiati ${ourBy(d.our).n} e ${other.o.n}`); return; }
      m.ourPos[d.our] = {x:+d.x.toFixed(1), y:+d.y.toFixed(1)}; save(); return;
    }
    if(d.empty){ if(UI.sel || UI.selSlot){ UI.sel = null; UI.selSlot = null; render(); } return; }
    if(d.ghost){ openKeypad(d.slot); return; }
    if(d.slot){ // modifica piano
      const plan = (M().plans || []).find(p => p.id === UI.editPlan), s = plan && plan.slots.find(x => x.id === d.slot); if(!s) return;
      if(d.moved){ s.x = +d.x.toFixed(1); s.y = +d.y.toFixed(1); save(); d.t.classList.remove('dragging'); }
      else { UI.selSlot = UI.selSlot === s.id ? null : s.id; render(); }
      return;
    }
    const p = oppBy(d.id);
    const bn = $('#bench');
    if(d.moved && p && bn && d.cx != null){ const br = bn.getBoundingClientRect();
      if(d.cy >= br.top - 4 && d.cy <= br.bottom && d.cx >= br.left && d.cx <= br.right){ // riportato in panchina
        const m = M(); Object.assign(p, {on:false, slot:null, mk:null, ck:null, pb:false, gk:false});
        if(UI.sel === p.id) UI.sel = null; save(); render(); toast(`${p.n} tolto dal campo`); return; } }
    if(d.moved && p){
      d.t.classList.remove('dragging');
      const r = pitch.getBoundingClientRect(), tpx = d.t.offsetWidth || 40;
      const target = oppOn(M()).filter(q => q !== p).map(q => ({q, dist:Math.hypot((q.x - d.x)/100*r.width, (q.y - d.y)/100*r.height)})).filter(o => o.dist < tpx*0.8).sort((a, b) => a.dist - b.dist)[0];
      if(target){ swapOppPos(p, target.q, {x:d.ox, y:d.oy}); render(); toast(`Scambiati ${p.n} e ${target.q.n}`); return; }
      p.x = +d.x.toFixed(1); p.y = +d.y.toFixed(1); save(); if(activePlan(M())) render();
    }
    else if(p && d.chip){ UI.sel = p.id; render(); GHOST_T = Date.now(); quickMarker(p); }
    else if(p){
      const now = Date.now(), dbl = LAST_TAP.id === p.id && now - LAST_TAP.t < 450;
      LAST_TAP = dbl ? {id:null, t:0} : {id:p.id, t:now};
      if(dbl){ UI.sel = p.id; render(); GHOST_T = Date.now(); quickSubOpp(p); return; }
      UI.sel = UI.sel === p.id ? null : p.id; render();
    }
  };
  pitch.addEventListener('pointerup', end);
  pitch.addEventListener('pointercancel', () => { if(drag && drag.t) drag.t.classList.remove('dragging'); drag = null; });
}
function assign(p, ourId){
  const m = M(), prev = p.mk || null; ourId = ourId || null;
  if(prev === ourId) return;
  const other = ourId ? oppOn(m).find(q => q.mk === ourId && q.id !== p.id) : null;
  p.mk = ourId;
  if(other) other.mk = prev;
  const txt = ourId ? `${nOur(ourId)} ora marca ${p.n}` : `${p.n} senza marcatore`;
  logMk(other ? `${txt} · ${prev ? nOur(prev)+' marca '+other.n : other.n+' senza marcatore'}` : txt);
  if(!started(m)){ const nx = nextUnmarked(m); UI.sel = nx ? nx.id : null; }
  save();
}

    if(d.x != null){ const [side, i] = d.key.split(':'); const o = side === 'ball' ? b.ball : b[side][+i]; o.x = +d.x.toFixed(1); o.y = +d.y.toFixed(1); if(side !== 'ball') b.man = true; save(); }
    d = null;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ---- Palle inattive ---- */
const ourByN = n => M().our.find(p => p.n === n);
function nums(sch, sl, side){ return (sch.sides ? sl.p[side || UI.side] : sl.p.all) || []; }
function setNums(sch, sl, arr){ if(sch.sides) sl.p[UI.side] = arr; else sl.p.all = arr; }
function pn(n){ const p = ourByN(n); const cls = !p ? 'nr' : (p.st === 'tit' ? '' : 'off');
  return `<span class="pn ${cls}"><b>${n}</b><small>${p ? (esc(surname(p)) || '&nbsp;') : 'non in rosa'}</small></span>`; }
function replaceNum(m, a, b){ (m.plans || []).forEach(pl => pl.slots.forEach(s => { if(s.mk === a) s.mk = b; })); (m.sp || []).forEach(sch => sch.slots.forEach(sl => Object.keys(sl.p).forEach(k => { sl.p[k] = sl.p[k].map(x => x === a ? b : x); }))); }
function setCk(ourId, oppId){
  const m = M(), prevOpp = oppOn(m).find(q => q.ck === ourId), target = oppId ? oppBy(oppId) : null;
  const targetPrev = target ? target.ck : null;
  if(prevOpp) prevOpp.ck = null;
  if(target){ target.ck = ourId; if(prevOpp && targetPrev && targetPrev !== ourId) prevOpp.ck = targetPrev; }
}
function curSch(m){ return m.sp.find(x => x.id === (UI.ctxSch || UI.spTab)); }
const cornerPair = m => [m.sp.find(x => x.type === 'cdif'), m.sp.find(x => x.type === 'coff')];
function spBar(m, sch){
  const ed = UI.spEdit === sch.id;
  const sideSeg = sch.sides ? `<div class="seg"><button class="${UI.side==='dx'?'on':''}" data-act="side" data-v="dx">Da destra</button><button class="${UI.side==='sx'?'on':''}" data-act="side" data-v="sx">Da sinistra</button></div>` : '';
  const sopra = (sch.type === 'coff' && !ed) ? `<div class="seg"><button disabled style="opacity:1">Loro sopra:</button>${[1,2,3].map(v => `<button class="${UI.sopra===v?'on':''}" data-act="sopra" data-v="${v}">${v}</button>`).join('')}</div>` : '';
  return `<div class="ctop">${sideSeg}${sopra}<span style="flex:1"></span><button class="btn ${ed?'pri':''}" data-act="spEditT">${ed ? '✓ Fine modifica' : '✎ Modifica schema'}</button></div>`;
}

function renderCorner(m){
  UI.ctxSch = null;
  const [cd, co] = cornerPair(m), pair = cd && co;
  if(pair && (UI.spTab === cd.id || UI.spTab === co.id)) UI.spTab = 'corner';
  if(!['alt', 'hist', 'corner'].includes(UI.spTab) && !curSch(m)) UI.spTab = pair ? 'corner' : (m.sp[0] ? m.sp[0].id : 'alt');
  if(UI.spTab === 'corner' && !pair) UI.spTab = m.sp[0] ? m.sp[0].id : 'alt';
  const tabs = [...(pair ? [['corner', 'Corner']] : []), ...m.sp.filter(x => !pair || (x !== cd && x !== co)).map(x => [x.id, x.name]), ['alt','Altezze avversari'], ['hist','Chi marcava chi']];
  const head = `<div class="sptabs">${tabs.map(([id,l]) => `<button class="${UI.spTab===id?'on':''}" data-act="spTab" data-v="${esc(id)}">${esc(l)}</button>`).join('')}<button data-act="spNew">＋ Schema</button><span style="flex:1"></span><button data-act="spPdf">📄 Importa PDF</button><button class="pvbtn" data-act="pvOpen">👥 Vista giocatori</button></div>`;
  if(UI.spTab === 'alt') return head + renderHeights(m);
  if(UI.spTab === 'hist') return head + renderHist(m);
  if(UI.spTab === 'corner'){
    const col = (sch, t, c) => { UI.ctxSch = sch.id; const body = UI.spEdit === sch.id ? spEditor(m, sch) : spView(m, sch); UI.ctxSch = null;
      return `<div class="ccol ${c}" data-sch="${sch.id}"><div class="cchead"><h2 class="cch">${t}</h2>${spBar(m, sch)}</div>${body}</div>`; };
    return head + `<div class="corner2">${col(cd, 'Difesa', 'dif')}${col(co, 'Attacco', 'off')}</div>`;
  }
  const sch = curSch(m);
  return head + spBar(m, sch) + (UI.spEdit === sch.id ? spEditor(m, sch) : spView(m, sch));
}
/* «… (da destra)» → titolo corto + etichetta del lato ben visibile */
function spLab(label){ const r = String(label || '').match(/^(.*?)[\s:]*\((da destra|da sinistra)\)\s*$/i);
  return r ? `<span class="sideTag ${/destra/i.test(r[2]) ? 'dx' : 'sx'}">${/destra/i.test(r[2]) ? 'da destra ▶' : '◀ da sinistra'}</span>${esc(r[1])}` : esc(label); }
function spCard(label, arr, cls, sl){
  if(!sl) return `<div class="spc ${cls||''} ${arr.length?'':'empty'}"><div class="spl">${spLab(label)}</div><div class="spn">${arr.map(pn).join('') || '<span class="hint" style="color:var(--warn)">da assegnare</span>'}</div></div>`;
  // compito modificabile: tocca un numero per cambiarlo o toglierlo, «+» per aggiungere
  return `<div class="spc ${cls||''} ${arr.length?'':'empty'}"><div class="spl">${spLab(label)}</div><div class="spn">${arr.map(n => `<button class="pnb" data-act="spNum" data-sl="${sl.id}" data-n="${n}" title="Cambia o togli il ${n}">${pn(n)}</button>`).join('')}${arr.length ? `<button class="spplus" data-act="spAdd" data-sl="${sl.id}" aria-label="Aggiungi un giocatore">+</button>` : `<button class="spplus wide" data-act="spAdd" data-sl="${sl.id}">da assegnare · tocca</button>`}</div></div>`;
}
function spView(m, sch){ return (sch.note ? `<div class="spnote">${esc(sch.note)}</div>` : '') + spViewBody(m, sch); }
function spViewBody(m, sch){
  if(sch.type === 'coff'){
    const used = new Set();
    const cards = sch.slots.map(sl => {
      const a = nums(sch, sl);
      if(sl.type === 'r2' || sl.type === 'r3'){
        const need = sl.type === 'r2' ? 2 : 3, act = UI.sopra >= need;
        if(act) a.forEach(n => used.add(n));
        return spCard(act ? '▶ Rientra ora (loro ' + need + ' sopra)' : sl.label, a, act ? 'key' : 'dim', sl);
      }
      a.forEach(n => used.add(n));
      return spCard(sl.label, a, sl.id === 'dietro' ? 'key' : '', sl);
    }).join('');
    const area = field(m).filter(p => !p.gk && !used.has(p.n)).map(p => p.n).sort((a,b) => a-b);
    return `<div class="spgrid">${cards}${spCard('In area (tutti gli altri)', area, 'area')}</div>
      <p class="hint">Con «Loro sopra» indichi quanti avversari restano alti: in arancione chi deve restare o rientrare. Dietro restano tanti dei nostri quanti sono i loro rimasti sopra.</p>`;
  }
  if(sch.type === 'cdif'){
    const mk = sch.slots.find(sl => sl.type === 'markers'), others = sch.slots.filter(sl => sl !== mk);
    let html = `<div class="spgrid">${others.map(sl => spCard(sl.label, nums(sch, sl), sl.id === 'palo' ? 'key' : '', sl)).join('')}</div>`;
    if(mk){
      const list = nums(sch, mk);
      const rows = list.map(n => { const o = ourByN(n), opp = o && oppOn(m).find(q => q.ck === o.id);
        return `<div class="mkrow"><button class="pnb" data-act="spNum" data-sl="${mk.id}" data-n="${n}" title="Cambia o togli il ${n}">${pn(n)}</button><span class="arr">→</span><button class="opb ${opp?'set':''}" data-act="spCk" data-n="${n}">${!o ? 'Non in rosa: tocca per sostituirlo' : opp ? `<b>${opp.n}</b><span>${[esc(opp.name), (opp.h ? H_LAB[opp.h] : '') + (opp.cm ? ' ' + esc(opp.cm) + ' cm' : ''), esc(opp.role)].map(x => x.trim()).filter(Boolean).join(', ')}</span>` : 'Tocca e scegli l\'avversario'}</button></div>`; }).join('');
      const ids = new Set(list.map(n => { const o = ourByN(n); return o && o.id; }).filter(Boolean));
      const gk = oppGK(m);
      const tallFree = oppOn(m).filter(q => q.h > 0 && !(gk && q.id === gk.id) && !(q.ck && ids.has(q.ck)));
      html += `<h3>${esc(mk.label)}</h3><div class="card mklist" style="padding:0 4px">${rows || '<p class="empty" style="padding:10px">Nessun marcatore: aggiungili con «Modifica schema».</p>'}</div>
        ${tallFree.length ? `<p class="warnline">⚠ Avversari segnati alti senza marcatore: ${tallFree.map(q => q.n + (q.name ? ' ' + esc(q.name) : '')).join(', ')}</p>` : ''}
        <p class="hint">Gli avversari sono ordinati per altezza (scheda «Altezze avversari»). Se scegli un avversario già marcato, i due marcatori si scambiano.</p>`;
    }
    return html;
  }
  return `<div class="spgrid">${sch.slots.map((sl, i) => spCard(sl.label, nums(sch, sl), (sch.type === 'pdif' && i < 3) ? 'key' : '', sl)).join('')}</div>`;
}
function spEditor(m, sch){

    <label class="fld"><span>Nota (facoltativa, la vedono anche i giocatori)</span><input data-spnote="1" value="${esc(sch.note || '')}" placeholder="es. Attenzione al timing"></label>

      <div class="edchips">${nums(sch, sl).map(n => { const p = ourByN(n); return `<button class="echip ${p && p.st==='tit' ? '' : 'off'}" data-act="spRm" data-sl="${esc(sl.id)}" data-n="${n}">${n}${p && p.name ? ' ' + esc(p.name) : ''} ✕</button>`; }).join('')}<button class="eadd" data-act="spAdd" data-sl="${esc(sl.id)}">＋ giocatore</button></div></div>`).join('')}

/* ---- Altezze avversari ---- */
function cornerList(m, sort){

  if(sort) list.sort((a,b) => (b.h - a.h) || ((+b.cm||0) - (+a.cm||0)) || byN(a,b)); else list.sort(byN);
  return list;
}

/* ---- Esportazione tag in formato Sportscode XML (Hudl) ----
   I tempi nel file sono secondi dall'inizio del video: inizio tempo nel video + secondo della nota. */
const mmss = v => { const t = String(v || '').trim(); if(!t) return null; const a = t.split(/[:.,']/).map(x => parseInt(x, 10) || 0); return a.length === 3 ? a[0]*3600 + a[1]*60 + a[2] : a.length === 2 ? a[0]*60 + a[1] : a[0]*60; };
const xmlTx = t => String(t == null ? '' : t).replace(/&/g, 'e').replace(/[<>]/g, '').replace(/[\u0000-\u001f]/g, ' ').trim();
function hudlXML(m, o){
  const notes = m.notes.filter(n => o.all ? (n.side || n.text) : n.side === 'zona').filter(n => n.half === 1 || n.half === 2);
  const t0 = {1:o.h1, 2:o.h2};
  const rows = [], inst = notes.map((n, i) => {
    const c = t0[n.half] + (n.sec || 0), code = n.side === 'zona' ? n.cat : (n.side === 'marc' ? 'Marcature' : n.cat);
    if(!rows.includes(code)) rows.push(code);
    const pl = n.pl ? M().our.find(x => x.id === n.pl) : null;
    const labels = [];
    if(n.pol) labels.push(['Esito', n.pol > 0 ? 'Positivo' : 'Negativo']);
    if(pl) labels.push(['Giocatore', pl.n + ' ' + fieldName(pl)]);
    labels.push(['Tempo', n.half + 'T']);
    let free = n.text || '';
    if(pl){ const pre = pl.n + ' ' + fieldName(pl); if(free.startsWith(pre)) free = free.slice(pre.length).replace(/^\s*·\s*/, ''); }
    return `  <instance>
    <ID>${i + 1}</ID>
    <start>${Math.max(0, c - o.pre).toFixed(2)}</start>
    <end>${(c + o.post).toFixed(2)}</end>
    <code>${xmlTx(code)}</code>
${labels.map(([g, t]) => `    <label>
      <group>${xmlTx(g)}</group>
      <text>${xmlTx(t)}</text>
    </label>`).join('\n')}${free ? `\n    <free_text>${xmlTx(n.min + ' ' + free)}</free_text>` : ''}
  </instance>`;
  });
  const col = c => /^OFF/.test(c) ? [8000, 46000, 16000] : /^DIF/.test(c) ? [6000, 26000, 60000] : /^(IND|Individuali)/.test(c) ? [60000, 40000, 0] : [40000, 40000, 40000];
  const order = [...CATS.zona, ...rows.filter(r => !CATS.zona.includes(r))].filter(r => rows.includes(r));
  return `<?xml version="1.0" encoding="UTF-8"?>
<file>
  <SORT_INFO>
    <sort_type>sort order</sort_type>
  </SORT_INFO>
  <ALL_INSTANCES>
${inst.join('\n')}
  </ALL_INSTANCES>
  <ROWS>
${order.map((r, i) => { const [R_, G, B] = col(r); return `    <row>
      <sort_order>${i + 1}</sort_order>
      <code>${xmlTx(r)}</code>
      <R>${R_}</R>
      <G>${G}</G>
      <B>${B}</B>
    </row>`; }).join('\n')}
  </ROWS>
</file>
`;
}

  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

/* toglie ogni riferimento ai giocatori eliminati (marcature, posizioni, cambi preparati, fasi) */
function cleanGone(m, side, gone){
  gone.forEach(id => {
    if(side === 'our'){ m.their.forEach(q => { if(q.mk === id) q.mk = null; if(q.ck === id) q.ck = null; }); if(m.ourPos) delete m.ourPos[id]; }
    const sp = side === 'our' ? m.subPlan : m.oppSubPlan;
    if(sp){ delete sp[id]; Object.keys(sp).forEach(k => { if(sp[k] === id) delete sp[k]; }); }
    Object.values(m.ph || {}).forEach(t => { if(t && t[side]) delete t[side][id]; });
  });
}
function bulkDel(el){ const side = el.dataset.side, m = M(), list = [...(side === 'our' ? m.our : m.their)].sort(byN);

function bulkDelGo(){ const m = M(), side = MC.side, ids = [...document.querySelectorAll('[data-bd]:checked')].map(c => c.dataset.bd);

  save(); closeModal(); render(); toast(ids.length + (ids.length === 1 ? ' giocatore eliminato' : ' giocatori eliminati')); }
/* nuovo elenco al posto del vecchio: stesso numero = stesso giocatore (tiene id, marcature, posizione), gli altri spariscono */
function pasteReplace(){
  const m = M(), side = MC.side, seen = new Set(), items = parseList($('#pTx').value).filter(it => !seen.has(it.n) && seen.add(it.n));
  if(!items.length) return toast('Nessun giocatore riconosciuto');
  if(side === 'our'){
    const list = items.map(({n, name}, i) => { const ex = m.our.find(p => p.n === n);
      const p = ex || {id:uid(), n, name:'', gk:false};
      if(name){ if(p.name !== name) p.fname = ''; p.name = name; }
      p.st = i < 11 ? 'tit' : 'pan'; if(!ex) p.gk = false; return p; });
    const keep = new Set(list.map(p => p.id)), gone = m.our.filter(p => !keep.has(p.id)).map(p => p.id);
    if(!list.some(p => p.gk && p.st === 'tit')){ const g = list.find(p => p.n === 1 && p.st === 'tit'); if(g) g.gk = true; }
    m.our = list;
    cleanGone(m, 'our', gone);
    (m.plans || []).forEach(pl => pl.slots.forEach(sl => { if(sl.mk != null && !list.some(p => p.n === sl.mk)) sl.mk = null; }));
  } else {
    const list = items.map(({n, name}, i) => { const ex = m.their.find(q => q.n === n);
      const q = ex || {id:uid(), n, name:'', gk:false, x:null, y:null, h:0, cm:'', role:'', mk:null, ck:null, pb:false, note:''};
      if(name) q.name = name; q.on = i < 11; q.exited = false; if(!q.on){ q.mk = null; q.ck = null; q.slot = null; } return q; });
    if(!list.some(q => q.gk)){ const g = list.find(q => q.n === 1); if(g) g.gk = true; }
    const keep = new Set(list.map(q => q.id)), gone = m.their.filter(q => !keep.has(q.id)).map(q => q.id);
    m.their = list;
    cleanGone(m, 'opp', gone);
  }
  save(); closeModal(); render(); toast('Elenco sostituito: ' + items.length + ' giocatori');
}

/* ============ Sincronizzazione Dropbox ============
   Il file JSON sta nella cartella dell'app su Dropbox (Applicazioni/<nome app>/panchina-db.json).
   Collegamento OAuth "PKCE" con codice da copiare: nessun segreto nella pagina, nessun rientro automatico. */
const DBX_APP_KEY = '';            /* App key dell'app Dropbox (si può inserire anche dall'Archivio) */
const DBX_PATH = '/panchina-db.json';
const DBXK = 'panchinaU16.dbx';
let DBX = (() => { try{ return JSON.parse(localStorage.getItem(DBXK)) || {}; }catch(e){ return {}; } })();
function dbxSave(){ try{ localStorage.setItem(DBXK, JSON.stringify(DBX)); }catch(e){} }
const dbxKey = () => DBX_APP_KEY || DBX.key || '';
const dbxOn = () => false;   /* Dropbox dismesso: i dati in squadra passano da Firebase (codice lasciato inattivo) */
const SYNC = {state:'', msg:'', busy:false, timer:null};
function setSync(state, msg){ SYNC.state = state; SYNC.msg = msg || ''; updSave(); const c = $('#dbxStatus'); if(c) c.innerHTML = dbxStatusText(); }
function dbxStatusText(){
  if(!dbxOn()) return 'Non collegato';
  const t = DBX.lastSync ? new Date(DBX.lastSync).toLocaleTimeString('it-CH', {hour:'2-digit', minute:'2-digit'}) + ' del ' + new Date(DBX.lastSync).toLocaleDateString('it-CH') : 'mai';
  if(SYNC.state === 'sync') return 'Sincronizzazione in corso…';
  if(SYNC.state === 'offline') return `Senza rete: le modifiche partono appena torna internet. Ultima sincronizzazione: ${t}`;
  if(SYNC.state === 'err') return `Errore: ${esc(SYNC.msg)}. Ultima sincronizzazione riuscita: ${t}`;
  return `Collegato. Ultima sincronizzazione: ${t}${S.dirty ? ' (modifiche da inviare)' : ''}`;
}
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function dbxAuthUrl(){
  if(!DBX.verifier || !DBX.challenge){
    DBX.verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    DBX.challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(DBX.verifier)));
    dbxSave();
  }
  return `https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(dbxKey())}&response_type=code&code_challenge=${DBX.challenge}&code_challenge_method=S256&token_access_type=offline`;
}
async function dbxToken(params){
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(params)});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error_description || j.error || ('risposta ' + r.status));
  return j;
}
async function dbxFinish(code){
  const j = await dbxToken({code:code.trim(), grant_type:'authorization_code', code_verifier:DBX.verifier, client_id:dbxKey()});
  Object.assign(DBX, {refresh:j.refresh_token, access:j.access_token, exp:Date.now() + ((j.expires_in || 14400) - 60)*1000, rev:null, lastSync:0});
  delete DBX.verifier; delete DBX.challenge; dbxSave();
}
async function dbxAccess(){
  if(DBX.access && Date.now() < (DBX.exp || 0)) return DBX.access;
  const j = await dbxToken({grant_type:'refresh_token', refresh_token:DBX.refresh, client_id:dbxKey()});
  DBX.access = j.access_token; DBX.exp = Date.now() + ((j.expires_in || 14400) - 60)*1000; dbxSave();
  return DBX.access;
}
async function dbxDownload(){
  const t = await dbxAccess();
  const r = await fetch('https://content.dropboxapi.com/2/files/download', {method:'POST', headers:{Authorization:'Bearer ' + t, 'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH})}});
  if(r.status === 409){ const tx = await r.text(); if(/not_found/.test(tx)) return null; throw new Error('Dropbox ' + tx.slice(0, 100)); }
  if(r.status === 401){ DBX.access = null; dbxSave(); throw new Error('accesso scaduto, riprova'); }
  if(!r.ok) throw new Error('download non riuscito (' + r.status + ')');
  const meta = JSON.parse(r.headers.get('dropbox-api-result') || '{}');
  const data = JSON.parse(await r.text());
  if(!data || data.app !== 'panchina-u16') throw new Error('il file su Dropbox non è un database di Panchina');
  return {rev:meta.rev, data};
}
async function dbxUpload(data, rev){
  const t = await dbxAccess();
  const mode = rev ? {'.tag':'update', update:rev} : {'.tag':'add'};
  const r = await fetch('https://content.dropboxapi.com/2/files/upload', {method:'POST', headers:{Authorization:'Bearer ' + t, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH, mode, autorename:false, mute:true})}, body:JSON.stringify(data)});
  if(r.status === 409) return {conflict:true};
  if(r.status === 401){ DBX.access = null; dbxSave(); throw new Error('accesso scaduto, riprova'); }
  if(!r.ok) throw new Error('invio non riuscito (' + r.status + ')');
  return {rev:(await r.json()).rev};
}
const isEmptyMatch = m => m && !m.opp && !(m.their || []).length && !(m.notes || []).length && !(m.plans || []).length && !(m.our || []).some(p => p.st === 'tit');
function syncPayload(){ return {app:'panchina-u16', v:1, savedAt:Date.now(), metaMod:S.metaMod || 0, squad:S.squad, spTpl:S.spTpl || null, matches:S.matches, deleted:S.deleted || {}}; }
function mergeRemote(r){
  const conflicts = [], since = DBX.lastSync || 0, del = {...(r.deleted || {})};
  Object.entries(S.deleted || {}).forEach(([k, v]) => { if(!del[k] || del[k] < v) del[k] = v; });
  const rm = r.matches || {}, remoteHasData = Object.values(rm).some(x => !isEmptyMatch(x));
  const out = {};
  new Set([...Object.keys(S.matches), ...Object.keys(rm)]).forEach(id => {
    if(del[id]) return;
    const l = S.matches[id], x = rm[id];
    if(!x){ if(!(remoteHasData && isEmptyMatch(l) && id !== S.cur)) out[id] = l; return; }
    if(!l){ out[id] = x; return; }
    const lm = l.mod || l.created || 0, xm = x.mod || x.created || 0;
    if(lm > since && xm > since && lm !== xm) conflicts.push(l.opp || x.opp || 'senza avversario');
    out[id] = xm > lm ? x : l;
  });
  if(remoteHasData && S.cur && isEmptyMatch(out[S.cur]) && Object.keys(out).length > 1){ del[S.cur] = Date.now(); delete out[S.cur]; }
  S.matches = out; S.deleted = del;
  if((r.metaMod || 0) > (S.metaMod || 0)){ S.squad = r.squad || []; S.spTpl = r.spTpl || null; S.metaMod = r.metaMod; }
  if(!S.matches[S.cur]){ const list = Object.values(S.matches).sort((a, b) => (b.mod || b.created || 0) - (a.mod || a.created || 0)); S.cur = list[0] ? list[0].id : null; }
  return conflicts;
}
async function syncNow(manual){
  if(!dbxOn() || SYNC.busy) return;
  if(!navigator.onLine){ setSync('offline'); if(manual) toast('Senza rete: sincronizzo appena torna internet'); return; }
  SYNC.busy = true; setSync('sync');
  try{
    for(let attempt = 0; attempt < 3; attempt++){
      const remote = await dbxDownload();
      let conflicts = [], changed = false;
      if(remote && remote.rev !== DBX.rev){ conflicts = mergeRemote(remote.data); changed = true; }
      if(!remote || S.dirty){
        const up = await dbxUpload(syncPayload(), remote ? remote.rev : null);
        if(up.conflict) continue;
        DBX.rev = up.rev;
      } else DBX.rev = remote.rev;
      S.dirty = false; DBX.lastSync = Date.now(); dbxSave(); save(true, {pref:true});
      if(changed){ M(); render(); }
      setSync('ok');
      if(conflicts.length) toast(`Modificata su due dispositivi: ${conflicts.join(', ')}. Tenuta la versione più recente.`);
      else if(manual) toast(changed ? 'Sincronizzato: dati aggiornati da Dropbox' : 'Sincronizzato');
      return;
    }
    throw new Error('troppe modifiche contemporanee, riprova');
  }catch(e){ setSync('err', e.message || String(e)); if(manual) toast('Sincronizzazione non riuscita: ' + (e.message || e)); }
  finally{ SYNC.busy = false; }
}
/* ============ Lavoro in squadra: Firebase Realtime Database (REST + streaming, senza librerie) ============
   Ogni pezzo della partita (dati generali, ogni giocatore, ogni nota, ogni schema…) è un nodo separato,

const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = PDFJS_URL; sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; ok(window.pdfjsLib); }; sc.onerror = () => ko(new Error('serve internet per leggere il PDF')); document.head.appendChild(sc); });

function shirtCol(r, g, b){
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  if(r > 140 && r - g > 50 && r - b > 40) return 'red';
  if(mx - mn < 38 && mx > 120 && mx < 240) return 'grey';
  if(Math.abs(r - g) < 28 && g > b + 22 && r > 90) return 'gk';
  return 'none';
}
async function readSpPdf(file){
  const pdfjs = await loadPdfJs();
  const doc = await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages = [];
  for(let n = 1; n <= doc.numPages; n++){
    const pg = await doc.getPage(n), vp = pg.getViewport({scale:1}), W = vp.width, H = vp.height;
    const tc = await pg.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => { const [x, y] = vp.convertToViewportPoint(i.transform[4], i.transform[5]); return {str:i.str.trim(), x:x / W, y:y / H, w:i.width / W, h:i.height / H, rot:!!i.transform[1]}; });
    const title = items.filter(i => i.rot || i.x < .07).sort((a, b) => b.y - a.y).map(i => i.str).join(' ');
    const norm = title.toLowerCase().replace(/[^a-z0-9]/g, '');
    const nums = items.filter(i => !i.rot && /^\d{1,2}(\/\d{1,2})?$/.test(i.str) && i.y > .12).map(i => ({str:i.str, x:i.x + i.w / 2, y:i.y - i.h * .38, w:i.w, h:i.h}));
    // colore della maglia sotto ogni numero
    const sc = 2, v2 = pg.getViewport({scale:sc}), cv = document.createElement('canvas'); cv.width = v2.width; cv.height = v2.height;
    const ctx = cv.getContext('2d', {willReadFrequently:true}); await pg.render({canvasContext:ctx, viewport:v2}).promise;
    nums.forEach(t => {
      const cx = t.x * cv.width, cy = t.y * cv.height, dx = (t.w / 2) * cv.width + 6, dy = t.h * cv.height * .9;
      const cols = [[cx - dx, cy], [cx + dx, cy], [cx, cy - dy], [cx - dx, cy - dy * .6], [cx + dx, cy - dy * .6]].map(([x, y]) => { const d = ctx.getImageData(Math.round(x), Math.round(y), 1, 1).data; return shirtCol(d[0], d[1], d[2]); });
      const cnt = {}; cols.forEach(c => cnt[c] = (cnt[c] || 0) + 1);
      t.col = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
    });
    pages.push({n, title, norm, nums});
  }

}
/* dalle pagine lette → proposta di compiti per ogni schema */
function spFromPdf(pages){
  const out = [], skipped = [], unknown = [];
  pages.forEach(p => {
    if(p.norm.includes('2ndhalf')) { if(p.nums.length) skipped.push(p.n); return; }
    const key = Object.keys(SP_PDF).find(k => SP_PDF[k].key(p.norm));
    if(!key){ if(p.nums.some(t => t.col === 'red' || t.col === 'grey')) unknown.push({page:p.n, txt:'slide non riconosciuta' + (p.title ? ' («' + p.title + '»)' : '')}); return; }
    const R = SP_PDF[key], res = {key, page:p.n, assign:{}, bad:[]};
    const put = (slot, side, val) => { const k = slot + '|' + (side || 'all'); (res.assign[k] = res.assign[k] || []).push(val); };
    const used = new Set();
    p.nums.filter(t => t.col === 'red' || t.col === 'grey').forEach(t => {
      if(R.list && t.x < R.list.xMax){ put(R.list.s, null, {v:t.str, y:t.y, x:t.x}); return; }
      let best = null, bd = .075;
      R.anchors.forEach((a, i) => { if(a.col && a.col !== t.col) return; if(used.has(i) && R.anchors.filter(b => b.s.join() === a.s.join() && b.side === a.side).length === 1) return;
        const d = Math.hypot(a.x - t.x, (a.y - t.y) * .5625); if(d < bd){ bd = d; best = i; } });
      if(best == null){ res.bad.push(t.str); return; }
      used.add(best); const a = R.anchors[best];
      a.s.forEach(slot => { if(R.sides && !a.side){ put(slot, 'dx', {v:t.str, y:t.y, x:t.x}); put(slot, 'sx', {v:t.str, y:t.y, x:t.x}); } else put(slot, R.sides ? a.side : null, {v:t.str, y:t.y, x:t.x}); });
    });

function applySpPdf(found){
  const m = M();
  found.res.forEach(r => {
    const R = SP_PDF[r.key];
    let sch = m.sp.find(x => x.type === r.key);
    if(!sch){ sch = {id:r.key === 'pen' ? 'pen' : uid(), name:R.name, type:r.key, sides:!!R.sides, slots:[]}; m.sp.push(sch); }
    Object.entries(R.slots).forEach(([id, label]) => {
      let sl = sch.slots.find(x => x.id === id);
      if(!sl){ sl = {id, label, p:R.sides ? {dx:[], sx:[]} : {all:[]}}; if(id === 'mk') sl.type = 'markers'; sch.slots.push(sl); }

      else sl.p.all = r.assign[id + '|all'] || [];

 der Spielverlagerung\tp. ex. perd son joueur sur le changement d'aile\te.g. loses his man on the switch of play\nGiocatore\tSpieler\tJoueur\tPlayer\nSalva senza giocatore\tOhne Spieler speichern\tEnregistrer sans joueur\tSave without player\nNessun titolare: segnali in Pre-partita.\tKeine Startspieler: markiere sie unter «Vor dem Spiel».\tAucun titulaire : indique-les dans Avant-match.\tNo starters: mark them in Pre-match.\n1° tempo\t1. Halbzeit\t1re mi-temps\t1st half\n2° tempo\t2. Halbzeit\t2e mi-temps\t2nd half\nTutta la partita\tGanzes Spiel\tTout le match\tWhole match\nTre messaggi per l'intervallo\tDrei Botschaften für die Halbzeit\tTrois messages pour la mi-temps\tThree messages for half-time\nTre messaggi di fine partita\tDrei Botschaften zum Spielende\tTrois messages de fin de match\tThree end-of-match messages\nMassimo tre interventi, in ordine di priorità. Le note con ★ sono qui sotto: tocca «Usa» per copiarle.\tHöchstens drei Punkte, nach Priorität. Die Notizen mit ★ stehen unten: «Übernehmen» antippen, um sie zu kopieren.\tTrois interventions au maximum, par ordre de priorité. Les notes avec ★ sont en dessous : touche «Utiliser» pour les copier.\tAt most three points, in order of priority. Notes with ★ are below: tap «Use» to copy them.\nMessaggio 1\tBotschaft 1\tMessage 1\tMessage 1\nMessaggio 2\tBotschaft 2\tMessage 2\tMessage 2\nMessaggio 3\tBotschaft 3\tMessage 3\tMessage 3\nNote evidenziate ★\tHervorgehobene Notizen ★\tNotes en évidence ★\tHighlighted notes ★\nUsa\tÜbernehmen\tUtiliser\tUse\nAccoppiamenti problematici (ora)\tProblematische Duelle (jetzt)\tDuels problématiques (maintenant)\tProblem match-ups (now)\nNessuno segnato.\tKeine markiert.\tAucun indiqué.\tNone flagged.\nCambi di marcatura\tDeckungswechsel\tChangements de marquage\tMarking changes\nNessun cambio.\tKeine Wechsel.\tAucun changement.\tNo changes.\nNessun cambio\tKein Wechsel\tAucun changement\tNo changes\nI tre messaggi sono già pieni\tDie drei Botschaften sind schon voll\tLe mento, resta l'ultima. Senza rete l'app continua a funzionare e invia tutto appena torna internet.\tAlle sehen und bearbeiten dieselben Spiele. Ändern zwei Personen gleichzeitig dasselbe, bleibt die letzte Änderung. Ohne Netz funktioniert die App weiter und sendet alles, sobald das Internet zurück ist.\tTout le monde voit et modifie les mêmes matchs. Si deux personnes changent la même chose en même temps, la dernière reste. Sans réseau l'app continue de fonctionner et envoie tout dès que l'internet revient.\tEveryone sees and edits the same matches. If two people change the same thing at the same time, the last one stays. Offline the app keeps working and sends everything as soon as the internet is back.\nRicollega\tNeu verbinden\tReconnecter\tReconnect\nCollegamento in corso…\tVerbindung läuft…\tConnexion en cours…\tConnecting…\nSenza rete: lavori sul tablet e le modifiche partono appena torna internet.\tOffline: du arbeitest auf dem Tablet und die Änderungen werden gesendet, sobald das Internet zurück ist.\tHors ligne : tu travailles sur la tablette et les modifications partent dès que l'internet revient.\tOffline: you work on the tablet and changes are sent as soon as the internet is back.\nAccesso non autorizzato.\tZugriff nicht erlaubt.\tAccès non autorisé.\tAccess not authorised.\nErrore:\tFehler:\tErreur :\tError:\nUscire dal lavoro in squadra?\tTeamarbeit verlassen?\tQuitter le travail en équipe ?\tLeave teamwork?\nLe partite restano su questo dispositivo, ma non si aggiornano più finché non rientri.\tDie Spiele bleiben auf diesem Gerät, werden aber nicht mehr aktualisiert, bis du dich wieder anmeldest.\tLes matchs restent sur cet appareil, mais ne se mettent plus à jour tant que tu ne te reconnectes pas.\tMatches stay on this device but stop updating until you sign in again.\nNon serve più: con il lavoro in squadra attivo i dati passano da lì. Il collegamento Dropbox resta salvato ma è in pausa.\tNicht mehr nötig: mit aktiver Teamarbeit laufen die Daten darüber. Die Dropbox-Verbindung bleibt gespeichert, ist aber pausiert.\tPlus nécessaire : avec le travail en équipe actif, les données passent par là. La connexion Dropbox reste enregistrée mais en pause.\tNo longer needed: with teamwork active, data goes through it. The Dropbox link stays saved but paused.\nImporta / backup\tImport / Backup\tImporter / sauvegarde\tImport / backup\nImporta un file di partita o un backup (.json)\tSpieldatei oder Backup importieren (.json)\tImporter un fichier de match ou une sauvegarde (.json)\tImport a match file or a backup (.json)\nEsporta backup completo\tVollständiges Backup exportieren\tExporter la sauvegarde complète\tExport full backup\naperta\toffen\touvert\topen\nTag per Hudl (Sportscode XML)\tTags für Hudl (Sportscode XML)\tTags pour Hudl (Sportscode XML)\tTags for Hudl (Sportscode XML)\nOgni nota diventa una clip nel video. Scrivi a che punto del video inizia ogni tempo (minuti:secondi), come lo vedi nel filmato di Hudl.\tJede Notiz wird zu einem Clip im Video. Gib an, an welcher Stelle im Video jede Halbzeit beginnt (Minuten:Sekunden), wie du es im Hudl-Film siehst.\tChaque note devient un clip dans la vidéo. Indique à quel moment de la vidéo commence chaque mi-temps (minutes:secondes), comme tu le vois dans le film Hudl.\tEach note becomes a clip in the video. Enter where in the video each half starts (minutes:seconds), as you see it in the Hudl footage.\nFischio d'inizio 1° tempo nel video\tAnpfiff 1. Halbzeit im Video\tCoup d'envoi 1re mi-temps dans la vidéo\tKick-off 1st half in the video\nFischio d'inizio 2° tempo nel video\tAnpfiff 2. Halbzeit im Video\tCoup d'envoi 2e mi-temps dans la vidéo\tKick-off 2nd half in the video\nSecondi prima della nota\tSekunden vor der Notiz\tSecondes avant la note\tSeconds before the note\nSecondi dopo la nota\tSekunden nach der Notiz\tSecondes après la note\tSeconds after the note\nScarica XML\tXML herunterladen\tTélécharger le XML\tDownload XML\nAnnulla l'ultimo segno\tLetzte Linie rü const LIX = () => ({de:0, fr:1, en:2})[LANG];
function trCore(s){
  const hit = I18N_MAP.get(s); if(hit) return hit[LIX()];
  for(const [rx, out] of I18N_RX){
    const mm = s.match(rx); if(!mm) continue;
    return out[LIX()].replace(/\$(\d)/g, (_, k) => { const g = mm[+k] || ''; const t = trCore(g.trim()); return t == null ? g : g.replace(g.trim(), t); });
  }
  return null;
}
function tr(str){
  if(LANG === 'it' || !str) return str;
  const mm = str.match(/^(\s*)([\s\S]*?)(\s*)$/), s = mm[2].replace(/\s+/g,' ');
  if(!s || !/[A-Za-zÀ-ÿ]/.test(s)) return str;
  let t = trCore(s);
  if(t == null){
    const p = s.match(/^([^A-Za-zÀ-ÿ0-9«(]*)(.*?)([\s:…?.!,;]*)$/);
    if(p && p[2] && (p[1] || p[3])){ const c = trCore(p[2]); if(c != null) t = p[1] + c + p[3]; }
  }
  if(t == null && s.includes(' · ')){
    const parts = s.split(' · ').map(x => { const y = tr(x); return y; });
    const joined = parts.join(' · '); if(joined !== s) t = joined;
